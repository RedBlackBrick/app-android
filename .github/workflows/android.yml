name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Machine CI a RAM limitee : pas de daemon Gradle, heap plafonne pour eviter l'OOM
  # (coherent avec forkEvery=1 / maxHeapSize=4g deja configures pour les tests unitaires).
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 : correspond exactement a `kotlin { jvmToolchain(17) }` et
      # `compileOptions { sourceCompatibility/targetCompatibility = VERSION_17 }` dans
      # app/build.gradle.kts, et c'est la version minimale requise pour executer Gradle avec
      # AGP 9.0.1 / Gradle 9.2.1. Utiliser la meme version que le toolchain projet evite tout
      # aller-chercher de JDK annexe (foojay-resolver) pendant le build CI.
      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secrets requis (voir docs/gradle-setup.md §CI/CD) :
      # - LOCAL_PROPERTIES_B64 : local.properties encode en base64 (VPS_BASE_URL, pins cert,
      #   endpoint/pubkey WireGuard). build.gradle.kts a des valeurs par defaut pour chaque
      #   buildConfigField donc le build ne casse pas si le secret est vide, mais le decoder
      #   dans ce cas ecrit un local.properties vide sans consequence.
      # - GOOGLE_SERVICES_B64 : app/google-services.json encode en base64. Le plugin
      #   com.google.gms.google-services echoue a la configuration si ce fichier est absent,
      #   meme pour un job qui ne fait que testDebugUnitTest/lintDebug.
      - name: Decode local.properties
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES_B64 }}
        run: echo "$LOCAL_PROPERTIES_B64" | base64 -d > local.properties

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json

      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload test/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          retention-days: 14

  # ── Job instrumente (Gradle Managed Devices) ────────────────────────────────
  # Desactive pour l'instant : necessite KVM sur le runner et les prerequis Phase 1
